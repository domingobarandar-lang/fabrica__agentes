<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Rondas QR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-titulo">🛡️ Rondas QR</div>
    <div id="chip-conexion" class="chip">—</div>
  </header>

  <main>
    <!-- Login -->
    <section id="vista-login" class="vista oculta">
      <h1>Iniciar sesión</h1>
      <p class="nota">Necesitas conexión solo para entrar. La ronda funciona sin señal.</p>
      <label>Usuario
        <input id="campo-usuario" autocomplete="username" autocapitalize="none" placeholder="ej: pedro">
      </label>
      <label>PIN
        <input id="campo-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="****">
      </label>
      <button id="btn-login" class="btn btn-principal">Entrar</button>
      <p id="error-login" class="error oculta"></p>
    </section>

    <!-- Inicio: rondas disponibles -->
    <section id="vista-inicio" class="vista oculta">
      <div class="saludo">
        <div>
          <div id="texto-guardia" class="grande"></div>
          <div id="texto-condominio" class="nota"></div>
        </div>
        <button id="btn-salir" class="btn btn-borde btn-chico">Salir</button>
      </div>
      <div id="estado-sync" class="tarjeta-sync oculta"></div>
      <h2>Rondas</h2>
      <div id="lista-rondas"></div>
      <button id="btn-actualizar" class="btn btn-borde">↻ Actualizar rondas desde el servidor</button>
      <p id="texto-paquete" class="nota centrado"></p>
    </section>

    <!-- Ronda en curso -->
    <section id="vista-ronda" class="vista oculta">
      <div class="ronda-cabecera">
        <div>
          <div id="ronda-nombre" class="grande"></div>
          <div id="ronda-avance" class="nota"></div>
        </div>
        <div id="ronda-progreso" class="progreso"></div>
      </div>
      <div id="lista-puntos"></div>
      <div class="botonera">
        <button id="btn-escanear" class="btn btn-principal btn-gigante">📷 Escanear QR</button>
        <button id="btn-manual" class="btn btn-borde">⌨️ Ingresar código a mano</button>
        <button id="btn-cerrar-ronda" class="btn btn-peligro">Terminar ronda</button>
      </div>
    </section>

    <!-- Resumen final -->
    <section id="vista-final" class="vista oculta">
      <h1 id="final-titulo"></h1>
      <div id="final-resumen"></div>
      <p id="final-sync" class="nota centrado"></p>
      <button id="btn-volver" class="btn btn-principal">Volver al inicio</button>
    </section>
  </main>

  <!-- Escáner -->
  <div id="modal-escaner" class="modal oculta">
    <video id="video" playsinline muted></video>
    <canvas id="lienzo" hidden></canvas>
    <div class="escaner-marco"></div>
    <div class="escaner-pie">
      <p class="nota centrado">Apunta al QR del punto de control</p>
      <button id="btn-cancelar-escaner" class="btn btn-borde">Cancelar</button>
    </div>
  </div>

  <!-- Código manual -->
  <div id="modal-manual" class="modal modal-centrado oculta">
    <div class="dialogo">
      <h2>Código del punto</h2>
      <p class="nota">Está impreso bajo el QR (6 letras/números).</p>
      <input id="campo-codigo" autocapitalize="characters" autocomplete="off" placeholder="ej: PRT234" maxlength="10">
      <div class="botonera-fila">
        <button id="btn-cancelar-manual" class="btn btn-borde">Cancelar</button>
        <button id="btn-confirmar-manual" class="btn btn-principal">Marcar</button>
      </div>
    </div>
  </div>

  <div id="aviso" class="aviso oculta"></div>

  <script src="vendor/jsqr.js"></script>
  <script src="app.js"></script>
</body>
</html>
